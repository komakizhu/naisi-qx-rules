name: Convert official Naisi QX rules

on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: '全部检查通过后提交生成文件到当前仓库（默认否）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: naisi-qx-update
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libicu-dev
          python3 --version
          node --version
          jq --version
      - name: Convert, audit and test in candidate directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 update.py --candidate-dir .build/candidate
      - name: Save candidate and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naisi-qx-candidate
          include-hidden-files: true
          path: |
            .build/candidate/
            logs/
          retention-days: 14

  publish:
    needs: validate
    if: >-
      (github.event_name == 'schedule' && vars.ENABLE_NAISI_AUTO_PUBLISH == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: naisi-qx-candidate
          path: .build/download
      - name: Promote only a fully validated candidate
        run: python3 update.py --promote .build/download/.build/candidate
      - name: Commit only generated files, never force push
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text())
          paths = sorted(manifest['files']) + ['manifest.json']
          Path('.build/publish-paths').write_bytes(b''.join(p.encode() + b'\0' for p in paths))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=.build/publish-paths --pathspec-file-nul
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update official Naisi QX resources'
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
